[project]
name = "nfc-path-doctor"
version = "0.1.5"
description = "Agent skill that diagnoses and safely fixes Unicode NFC/NFD file name mismatches across the file system, git index, zip files and text references."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

# The skill itself needs no packages (standard library only). pytest is for developing the bundled scripts.
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["skills/nfc-path-doctor/scripts", "tools"]

[tool.uv]
package = false
